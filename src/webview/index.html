<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-INJECT_NONCE';">
  <title>vscode-diff Next</title>
  <style>/* INJECT_CSS */</style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="session-tabs" id="sessionTabs" role="tablist" aria-label="Compare sessions"></div>
      <div class="targets-bar">
        <div class="side side-1" title="Target 1">
          <button type="button" id="endpoint1" class="endpoint-select" aria-label="Target 1" aria-haspopup="listbox" aria-expanded="false">
            <span class="endpoint-label" id="endpoint1Label">Select folder…</span>
            <span class="endpoint-caret" aria-hidden="true">▾</span>
          </button>
        </div>
        <button type="button" id="swapBtn" class="icon-btn swap-btn" title="Swap both sides">
          <span class="icon" aria-hidden="true">⇄</span>
        </button>
        <div class="side side-2" title="Target 2">
          <button type="button" id="endpoint2" class="endpoint-select" aria-label="Target 2" aria-haspopup="listbox" aria-expanded="false">
            <span class="endpoint-label" id="endpoint2Label">Select folder…</span>
            <span class="endpoint-caret" aria-hidden="true">▾</span>
          </button>
        </div>
        <button type="button" id="refreshBtn" class="icon-btn" title="Refresh">
          <span class="icon" aria-hidden="true">↻</span>
        </button>
      </div>
      <div id="picker" class="picker hidden" hidden>
        <div class="picker-search">
          <input type="text" id="pickerSearch" placeholder="Filter…" aria-label="Filter folders or branches">
        </div>
        <div class="picker-crumb" id="pickerCrumb"></div>
        <div id="pickerList" class="picker-list" role="listbox" tabindex="0"></div>
      </div>
    </header>

    <div class="content">
      <section class="changes-section">
        <div class="section-header collapsible" id="changesHeader">
          <div class="section-header-main">
            <span id="changesCount">0 changes</span>
            <span id="compareContext" class="compare-context"></span>
          </div>
          <div class="header-tools" id="headerTools">
            <div class="font-size-tools" id="fontSizeTools" title="List font size">
              <button type="button" id="fontMinus" class="font-btn" aria-label="Smaller list font">−</button>
              <span id="fontSizeLabel" class="font-size-label">12</span>
              <button type="button" id="fontPlus" class="font-btn" aria-label="Larger list font">+</button>
            </div>
            <div class="stats" id="statsRow">
              <span class="additions" id="totalAdditions" hidden></span>
              <span class="deletions" id="totalDeletions" hidden></span>
            </div>
          </div>
        </div>
        <div id="changesBody" class="section-body">
          <div id="fileTree" class="file-tree" tabindex="0" role="listbox" aria-label="Changed files">
            <div class="empty-state">Pick two unique endpoints</div>
          </div>
        </div>
      </section>

      <div class="resizer" id="resizer"></div>

      <section class="commits-section collapsed">
        <div class="section-header collapsible collapsed" id="commitsHeader">
          <span id="commitsTitle">Commit history</span>
        </div>
        <div id="commitsBody" class="section-body collapsed">
          <div class="commit-search">
            <input type="text" id="commitSearch" placeholder="Search commits…">
          </div>
          <div id="commitList" class="commit-list">
            <div class="empty-state">No commits</div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script nonce="INJECT_NONCE">/* INJECT_STATUS_TABLE */
/* INJECT_PICKER */
/* INJECT_JS */</script>
</body>
</html>
